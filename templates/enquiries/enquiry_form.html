{% extends "base.html" %}

{% block content %}

<section class="section-padding">
    <div class="container">

        <div class="section-heading text-center">
            <span>Get in touch</span>
            <h1>Send an Enquiry</h1>
            <p>Tell us about your trip and we'll get back to you.</p>
        </div>

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <form method="POST" class="enquiry-form">

                    {% csrf_token %}

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">
                                Your Name
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Hotel
                            </label>

                            <select name="hotel" class="form-select">

                                <option value="">
                                    Select Hotel
                                </option>

                                {% for hotel in hotels %}

                                <option
                                    value="{{ hotel.id }}"
                                    {% if selected_hotel == hotel.slug %}
                                        selected
                                    {% endif %}
                                >
                                    {{ hotel.name }}
                                </option>

                                {% endfor %}

                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Package
                            </label>

                            <select name="package" class="form-select">

                                <option value="">
                                    Select Package
                                </option>

                                {% for package in packages %}

                                <option
                                    value="{{ package.id }}"
                                    {% if selected_package == package.slug %}
                                        selected
                                    {% endif %}
                                >
                                    {{ package.name }}
                                </option>

                                {% endfor %}

                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Travel Date
                            </label>

                            <input
                                type="date"
                                name="travel_date"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Adults
                            </label>

                            <input
                                type="number"
                                name="adults"
                                class="form-control"
                                value="1"
                                min="1"
                            >
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Children
                            </label>

                            <input
                                type="number"
                                name="children"
                                class="form-control"
                                value="0"
                                min="0"
                            >
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Message
                            </label>

                            <textarea
                                name="message"
                                class="form-control"
                                rows="5"
                                placeholder="Tell us about your trip..."
                            ></textarea>
                        </div>

                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-dark btn-lg"
                            >
                                Send Enquiry
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>
</section>

{% endblock %}
